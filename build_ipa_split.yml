name: Build NXNative IPA (Test RomFS Separate)

on:
  workflow_dispatch:
    inputs:
      gdrive_id:
        description: "Lien Google Drive ou ID du pack (.zip avec .nsp et prod.keys)"
        required: true
        type: string
      game_name:
        description: "Nom du jeu (sans espace, ex: Mario_Wonder)"
        required: true
        default: "Test_Game"
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Cloner nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative

      - name: Selectionner Xcode 26.3, liberer 50 Go et patcher nxnative
        run: |
          LATEST_XCODE=$(python3 -c 'import os, glob; apps = [os.path.realpath(p) for p in glob.glob("/Applications/Xcode*.app") if os.path.exists(os.path.realpath(p))]; apps.sort(); print(apps[-1])')
          echo "Vrai dossier Xcode conserve : $LATEST_XCODE"
          for app in /Applications/Xcode*.app; do
            REAL_APP=$(python3 -c "import os, sys; print(os.path.realpath(sys.argv[1]))" "$app")
            if [ "$REAL_APP" != "$LATEST_XCODE" ] && [ "$app" != "$LATEST_XCODE" ]; then
              sudo rm -rf "$app"
            fi
          done
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          sudo rm -rf /Library/Developer/CoreSimulator /Users/runner/hostedtoolcache /opt/homebrew/Cellar/llvm* /Applications/Android*
          sed -i '' 's/.*deviceMotionBody.*/\/\/ patched for iOS 26.2 SDK/g' dm/ios/Sources/DmGamepad.m
          find dm/ios -name "*.swift" -exec sed -i '' 's/if #available(iOS 27/if #available(iOS 99/g' {} +
          find scripts -name "*.py" -exec sed -i '' 's/5 \* 1024 \* 1024 \* 1024/100 * 1024 * 1024/g' {} +
          find scripts -name "*.py" -exec sed -i '' 's/5_000_000_000/100_000_000/g' {} +

      - name: Installer les dependances
        run: |
          LATEST_XCODE=$(python3 -c 'import os, glob; apps = [os.path.realpath(p) for p in glob.glob("/Applications/Xcode*.app") if os.path.exists(os.path.realpath(p))]; apps.sort(); print(apps[-1])')
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          python3 -m pip install --break-system-packages lz4 capstone fonttools nsz gdown "backports.zstd; python_version < '3.14'"

      - name: Telecharger et extraire (via API Google Drive)
        run: |
          mkdir -p ~/work_dir/game
          FILE_ID=$(echo "${{ inputs.gdrive_id }}" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
          if [ -z "$FILE_ID" ]; then FILE_ID=$(echo "${{ inputs.gdrive_id }}" | sed -n 's/.*id=\([a-zA-Z0-9_-]*\).*/\1/p'); fi
          if [ -z "$FILE_ID" ]; then FILE_ID="${{ inputs.gdrive_id }}"; fi
          curl -L "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&acknowledgeAbuse=true&key=AIzaSyCZY499Kdh3mc4pTMngYwZeCaoum4DeThs" -o ~/work_dir/pack.zip
          7z x ~/work_dir/pack.zip -o$HOME/work_dir/game -y
          rm -f ~/work_dir/pack.zip
          find ~/work_dir/game -type f -exec mv -i {} ~/work_dir/game/ \; 2>/dev/null || true

      - name: Restaurer le cache des Shaders
        uses: actions/cache/restore@v4
        with:
          path: ~/work_dir/game/*_build/shader
          key: shaders-${{ inputs.game_name }}-v1

      - name: Generer IPA leger (--romfs separate)
        run: |
          LATEST_XCODE=$(python3 -c 'import os, glob; apps = [os.path.realpath(p) for p in glob.glob("/Applications/Xcode*.app") if os.path.exists(os.path.realpath(p))]; apps.sort(); print(apps[-1])')
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          export DEVELOPER_DIR="$LATEST_XCODE/Contents/Developer"
          (
            while [ ! -d ~/work_dir/game/*_build/shader ]; do sleep 5; done
            rm -f ~/work_dir/game/*.nsp ~/work_dir/game/*.nsz
          ) &
          KEYS_FILE=$(find ~/work_dir/game -iname "*prod.keys*" | head -n 1)
          python3 scripts/build_ipa_from_nsp.py ~/work_dir/game -k "$KEYS_FILE" -o ~/work_dir/${{ inputs.game_name }}.ipa --lang fr --allow-other-metal --romfs separate

      - name: Sauvegarder le cache des Shaders
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/work_dir/game/*_build/shader
          key: shaders-${{ inputs.game_name }}-v2

      - name: Uploader le petit IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-Slim-IPA
          path: ~/work_dir/${{ inputs.game_name }}.ipa
          retention-days: 1

      - name: Uploader le dossier RomFS separe
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-RomFS-Data
          path: ~/work_dir/game/*_build/extract/*/RomFS
          retention-days: 1
