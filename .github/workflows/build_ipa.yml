name: Build NXNative IPA

on:
  workflow_dispatch:
    inputs:
      gdrive_id:
        description: "Colle ici le lien Google Drive ou l ID de ton pack.zip"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Cloner nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative

      - name: Selectionner Xcode 26.3 et patcher DmGamepad.m
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Xcode selectionne : $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          # Desactive les appels specifiques au SDK iOS 27 absents d Xcode 26.3
          sed -i '' 's/.*deviceMotionBody.*/\/\/ patched for iOS 26.2 SDK/g' dm/ios/Sources/DmGamepad.m
          find dm/ios -name "*.swift" -exec sed -i '' 's/if #available(iOS 27/if #available(iOS 99/g' {} +

      - name: Installer les dependances
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools nsz gdown "backports.zstd; python_version < '3.14'"

      - name: Telecharger et extraire les fichiers
        run: |
          mkdir -p ~/work_dir/game
          FILE_ID=$(echo "${{ inputs.gdrive_id }}" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
          if [ -z "$FILE_ID" ]; then FILE_ID="${{ inputs.gdrive_id }}"; fi
          python3 -m gdown "$FILE_ID" -O ~/work_dir/pack.zip
          unzip -j ~/work_dir/pack.zip -d ~/work_dir/game
          ls -la ~/work_dir/game

      - name: Restaurer le cache des Shaders iOS
        uses: actions/cache/restore@v4
        with:
          path: ~/work_dir/game/0100000011D90000_build/shader
          key: shaders-bdsp-v2

      - name: Generer le fichier IPA
        run: |
          KEYS_FILE=$(find ~/work_dir/game -iname "*prod.keys*" | head -n 1)
          python3 scripts/build_ipa_from_nsp.py ~/work_dir/game -k "$KEYS_FILE" -o ~/work_dir/Pokemon_BD.ipa --lang fr --allow-other-metal || {
            echo "=== ERREURS EXACTES XCODEBUILD ==="
            grep -E "error:|fatal error:|FAIL" ~/work_dir/game/0100000011D90000_build/ipa/build/ios/pkg/build.log || true
            exit 1
          }

      - name: Sauvegarder le cache des Shaders iOS
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/work_dir/game/0100000011D90000_build/shader
          key: shaders-bdsp-v2

      - name: Uploader le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Diamant-IPA
          path: ~/work_dir/Pokemon_BD.ipa
          retention-days: 1
