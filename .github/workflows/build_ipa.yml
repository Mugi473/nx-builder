name: Build NXNative IPA

on:
  workflow_dispatch:
    inputs:
      gdrive_id:
        description: "Colle ici le lien Google Drive ou l ID de ton pack TOTK"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Cloner nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative

      - name: Selectionner Xcode 26.3 et patcher DmGamepad.m
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Xcode selectionne : $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          sed -i '' 's/.*deviceMotionBody.*/\/\/ patched for iOS 26.2 SDK/g' dm/ios/Sources/DmGamepad.m
          find dm/ios -name "*.swift" -exec sed -i '' 's/if #available(iOS 27/if #available(iOS 99/g' {} +

      - name: Installer les dependances
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools nsz gdown "backports.zstd; python_version < '3.14'"

      - name: Telecharger et extraire (via API Google Drive)
        run: |
          mkdir -p ~/work_dir/game
          FILE_ID=$(echo "${{ inputs.gdrive_id }}" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
          if [ -z "$FILE_ID" ]; then FILE_ID=$(echo "${{ inputs.gdrive_id }}" | sed -n 's/.*id=\([a-zA-Z0-9_-]*\).*/\1/p'); fi
          if [ -z "$FILE_ID" ]; then FILE_ID="${{ inputs.gdrive_id }}"; fi
          echo "Telechargement de l ID : $FILE_ID"
          curl -L "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&acknowledgeAbuse=true&key=AIzaSyBTd0MxB-qSxj34TwK-AsSNWREspfc8lek" -o ~/work_dir/pack.zip
          ls -lh ~/work_dir/pack.zip
          unzip -j ~/work_dir/pack.zip -d ~/work_dir/game
          rm -f ~/work_dir/pack.zip
          ls -la ~/work_dir/game
          df -h

      - name: Restaurer le cache des Shaders TOTK
        uses: actions/cache/restore@v4
        with:
          path: ~/work_dir/game/*_build/shader
          key: shaders-totk-v1

      - name: Generer le fichier IPA
        run: |
          KEYS_FILE=$(find ~/work_dir/game -iname "*prod.keys*" | head -n 1)
          python3 scripts/build_ipa_from_nsp.py ~/work_dir/game -k "$KEYS_FILE" -o ~/work_dir/Zelda_TOTK.ipa --lang fr --allow-other-metal

      - name: Sauvegarder le cache des Shaders TOTK
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/work_dir/game/*_build/shader
          key: shaders-totk-v1

      - name: Uploader le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zelda-TOTK-IPA
          path: ~/work_dir/Zelda_TOTK.ipa
          retention-days: 1
