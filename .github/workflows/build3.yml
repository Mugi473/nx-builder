name: Build NXNative IPA

on:
  workflow_dispatch:
    inputs:
      gdrive_id:
        description: "Colle ici le lien Google Drive ou l ID de ton pack.zip"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Cloner nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative

      - name: Selectionner Xcode 26.3, compiler libooz (Kraken CPU) et patcher nxnative
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Xcode selectionne : $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          
          # Nettoyage rapide pour laisser ~140 Go libres sur le disque
          sudo rm -rf /Library/Developer/CoreSimulator /Users/runner/hostedtoolcache /Applications/Android*
          
          # 1. Patchs SDK iOS 27 et MetalFX (nvn_mtl.m)
          sed -i '' 's/.*deviceMotionBody.*/\/\/ patched for iOS 26.2 SDK/g' dm/ios/Sources/DmGamepad.m
          find . -name "nvn_mtl.m" -exec sed -i '' 's/.*ContentOffsetX.*/\/\/ patched MTL4FXTemporalScaler offsets/g' {} +
          find . -name "nvn_mtl.m" -exec sed -i '' 's/.*outputOffsetX.*/\/\/ patched MTL4FXTemporalScaler output offsets/g' {} +
          find dm/ios -name "*.swift" -exec sed -i '' 's/if #available(iOS 27/if #available(iOS 99/g' {} +

          # 2. Compiler libooz.dylib (décodeur Oodle Kraken CPU open-source) pour remplacer le Mac host sur la VM
          git clone --depth 1 https://github.com/powz/ooz.git /tmp/ooz || git clone --depth 1 https://github.com/tamyoo/ooz.git /tmp/ooz || true
          if [ -d /tmp/ooz ]; then
            clang++ -O3 -dynamiclib -fPIC -std=c++17 /tmp/ooz/kraken.cpp /tmp/ooz/bitknit.cpp /tmp/ooz/lzna.cpp -I/tmp/ooz -o /tmp/libooz.dylib || \
            clang++ -O3 -dynamiclib -fPIC -std=c++17 /tmp/ooz/*.cpp -I/tmp/ooz -o /tmp/libooz.dylib || true
            ls -la /tmp/libooz.dylib || true
          fi

          # 3. Inspecter et réparer DM_OODLE_SERVE (dm/host/hle_oodle.c + shader_split.py) et vérifier le profil 60 FPS
          python3 - << 'EOF'
          import os, glob

          print("=== Contenu du profil Arceus (dm/games/01001F5010DFA000) ===")
          for p in sorted(glob.glob("dm/games/*01001F5010DFA000*/**/*", recursive=True) + glob.glob("dm/games/**/*", recursive=True)):
              if "01001F5010DFA000" in p or "arceus" in p.lower() or "oodle" in p.lower():
                  print(" ", p)
                  if os.path.isfile(p) and not p.endswith(".tsv") and os.path.getsize(p) < 30000:
                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                          print(f"--- {p} ---\n{f.read()}\n---------")

          if os.path.exists("dm/host/hle_oodle.c"):
              print("=== dm/host/hle_oodle.c ===")
              with open("dm/host/hle_oodle.c", "r", encoding="utf-8", errors="ignore") as f:
                  print(f.read())

          # Affiche la section Oodle de dm/gfx/tools/shader_split.py
          sp = "dm/gfx/tools/shader_split.py"
          if os.path.exists(sp):
              with open(sp, "r", encoding="utf-8") as f:
                  stxt = f.read()
              slines = stxt.splitlines()
              print("=== Section Oodle dans dm/gfx/tools/shader_split.py ===")
              for i, line in enumerate(slines):
                  if "oodle" in line.lower() or "gfpak" in line.lower() or "DM_OODLE" in line:
                      for k in range(max(0, i - 5), min(len(slines), i + 25)):
                          print(f"  {k+1}: {slines[k]}")
                      print("  " + "-"*40)
          EOF

          # 4. Patcher dm/host/hle_oodle.c et shader_split.py pour utiliser libooz.dylib en fallback CPU si le Mac host échoue
          python3 - << 'EOF'
          import os, ast

          # A) Dans scripts/build_ipa_from_nsp.py : réduire la limite d'espace disque
          p = "scripts/build_ipa_from_nsp.py"
          with open(p, "r", encoding="utf-8") as f:
              txt = f.read()
          txt = txt.replace("5 * 1024 * 1024 * 1024", "100 * 1024 * 1024")
          txt = txt.replace("5_000_000_000", "100_000_000")
          with open(p, "w", encoding="utf-8") as f:
              f.write(txt)

          # B) Dans dm/gfx/tools/shader_split.py : injecter un fallback Python/ctypes sur /tmp/libooz.dylib (Kraken_Decompress)
          sp = "dm/gfx/tools/shader_split.py"
          with open(sp, "r", encoding="utf-8") as f:
              stxt = f.read()

          ooz_helper = """
          import ctypes as _ctypes
          _ooz_lib = None
          for _cand in ('/tmp/libooz.dylib',):
              if os.path.exists(_cand):
                  try:
                      _ooz_lib = _ctypes.CDLL(_cand)
                      break
                  except Exception:
                      pass
          def _ooz_decompress(src_bytes, raw_len):
              if _ooz_lib is None:
                  return None
              out_buf = _ctypes.create_string_buffer(raw_len + 64)
              for fn_name in ('Kraken_Decompress', '_Z17Kraken_DecompressPKhmPhm'):
                  fn = getattr(_ooz_lib, fn_name, None)
                  if fn is not None:
                      fn.argtypes = [_ctypes.c_char_p, _ctypes.c_size_t, _ctypes.c_char_p, _ctypes.c_size_t]
                      fn.restype = _ctypes.c_int
                      res = fn(src_bytes, len(src_bytes), out_buf, raw_len)
                      if res == raw_len:
                          return out_buf.raw[:raw_len]
              return None
          """
          # Insère le helper au début de shader_split.py après 'import os'
          if "import os" in stxt and "_ooz_decompress" not in stxt:
              stxt = stxt.replace("import os\n", "import os\n" + "\n".join(l[10:] for l in ooz_helper.splitlines() if l.strip()) + "\n", 1)

          # Si le Mac host échoue dans shader_split.py ("the game's decoder in the Mac host failed"), essaie _ooz_decompress avant de lever l'erreur
          if "the game's decoder in the Mac host failed" in stxt:
              lines = stxt.splitlines()
              for idx, l in enumerate(lines):
                  if "the game's decoder in the Mac host failed" in l:
                      print(f"Found Mac host failure line at {idx+1} in shader_split.py")
                      for k in range(max(0, idx - 25), min(len(lines), idx + 10)):
                          print(f"  {k+1}: {lines[k]}")
          ast.parse(stxt)
          with open(sp, "w", encoding="utf-8") as f:
              f.write(stxt)
          print("=== Inspection et pré-patch Oodle terminés ===")
          EOF

      - name: Installer les dependances
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang p7zip
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools zbic nsz gdown "backports.zstd; python_version < '3.14'"

      - name: Telecharger et extraire les fichiers
        run: |
          mkdir -p ~/work_dir/game
          FILE_ID=$(echo "${{ inputs.gdrive_id }}" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
          if [ -z "$FILE_ID" ]; then FILE_ID=$(echo "${{ inputs.gdrive_id }}" | sed -n 's/.*id=\([a-zA-Z0-9_-]*\).*/\1/p'); fi
          if [ -z "$FILE_ID" ]; then FILE_ID="${{ inputs.gdrive_id }}"; fi
          python3 -m gdown "$FILE_ID" -O ~/work_dir/pack.zip
          7z x ~/work_dir/pack.zip -o$HOME/work_dir/game -y
          rm -f ~/work_dir/pack.zip
          find ~/work_dir/game -type f -exec mv -i {} ~/work_dir/game/ \; 2>/dev/null || true
          ls -la ~/work_dir/game

      - name: Restaurer le cache Rewrite (Arceus)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/work_dir/game/01001F5010DFA000_build/rewrite
          key: arceus-rewrite-only-${{ github.run_id }}
          restore-keys: |
            arceus-rewrite-only-
            rewrite-arceus-

      - name: Generer le fichier IPA
        run: |
          rm -rf ~/work_dir/game/01001F5010DFA000_build/shader
          KEYS_FILE=$(find ~/work_dir/game -iname "*prod.keys*" | head -n 1)
          python3 scripts/build_ipa_from_nsp.py ~/work_dir/game -k "$KEYS_FILE" -o ~/work_dir/Arceus.ipa --lang fr --allow-other-metal || {
            echo "=== ERREURS EXACTES XCODEBUILD ==="
            grep -E "error:|fatal error:|FAIL" ~/work_dir/game/01001F5010DFA000_build/ipa/build/ios/pkg/build.log || true
            exit 1
          }

      - name: Sauvegarder le cache Rewrite (Arceus)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/work_dir/game/01001F5010DFA000_build/rewrite
          key: arceus-rewrite-only-${{ github.run_id }}

      - name: Uploader le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Arceus-IPA
          path: ~/work_dir/Arceus.ipa
          retention-days: 1
