name: Build NXNative IPA

on:
  workflow_dispatch:
    inputs:
      gdrive_id:
        description: "Colle ici le lien Google Drive ou l ID de ton pack.zip"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Cloner nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative

      - name: Selectionner Xcode 26.3 et patcher nxnative
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Xcode selectionne : $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          
          # Nettoyage rapide pour laisser ~140 Go libres sur le disque
          sudo rm -rf /Library/Developer/CoreSimulator /Users/runner/hostedtoolcache /Applications/Android*
          
          # 1. Patchs SDK iOS 27 et MetalFX (nvn_mtl.m)
          sed -i '' 's/.*deviceMotionBody.*/\/\/ patched for iOS 26.2 SDK/g' dm/ios/Sources/DmGamepad.m
          find . -name "nvn_mtl.m" -exec sed -i '' 's/.*ContentOffsetX.*/\/\/ patched MTL4FXTemporalScaler offsets/g' {} +
          find . -name "nvn_mtl.m" -exec sed -i '' 's/.*outputOffsetX.*/\/\/ patched MTL4FXTemporalScaler output offsets/g' {} +
          find dm/ios -name "*.swift" -exec sed -i '' 's/if #available(iOS 27/if #available(iOS 99/g' {} +

          # 2. Patch chirurgical de split_shaders (synchronise les tables tmp/tables -> g.table(n) pour l'étape [5/7])
          python3 - << 'EOF'
          import ast

          p = "scripts/build_ipa_from_nsp.py"
          with open(p, "r", encoding="utf-8") as f:
              txt = f.read()

          txt = txt.replace("5 * 1024 * 1024 * 1024", "100 * 1024 * 1024")
          txt = txt.replace("5_000_000_000", "100_000_000")

          tree = ast.parse(txt)
          lines = txt.splitlines()

          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef) and node.name == "split_shaders":
                  calls_to_patch = []
                  for sub in ast.walk(node):
                      if isinstance(sub, ast.Raise) and sub.lineno > node.lineno + 15:
                          calls_to_patch.append(sub)

                  for call_node in sorted(calls_to_patch, key=lambda n: n.lineno, reverse=True):
                      s_line = call_node.lineno - 1
                      e_line = call_node.end_lineno
                      indent = " " * call_node.col_offset
                      print(f"--> Syncing tables & neutralizing raise at line {s_line+1}")
                      lines[s_line:e_line] = [
                          f"{indent}print('[BYPASS] Syncing split tables to profile at line {s_line+1}')",
                          f"{indent}for _n in ('shader_map.tsv', 'shader_facts.tsv', 'shader_pairs.tsv', 'pso_pairs.tsv'):",
                          f"{indent}    if (tmp / 'tables' / _n).is_file(): shutil.copyfile(tmp / 'tables' / _n, g.table(_n))"
                      ]

          new_txt = "\n".join(lines) + "\n"
          ast.parse(new_txt)
          with open(p, "w", encoding="utf-8") as f:
              f.write(new_txt)
          print("=== PATCH OK : tables synchronisées pour [5/7] iOS shaders ===")
          EOF

      - name: Installer les dependances
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang p7zip
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools zbic nsz gdown "backports.zstd; python_version < '3.14'"

      - name: Telecharger et extraire les fichiers
        run: |
          mkdir -p ~/work_dir/game
          FILE_ID=$(echo "${{ inputs.gdrive_id }}" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
          if [ -z "$FILE_ID" ]; then FILE_ID=$(echo "${{ inputs.gdrive_id }}" | sed -n 's/.*id=\([a-zA-Z0-9_-]*\).*/\1/p'); fi
          if [ -z "$FILE_ID" ]; then FILE_ID="${{ inputs.gdrive_id }}"; fi
          python3 -m gdown "$FILE_ID" -O ~/work_dir/pack.zip
          7z x ~/work_dir/pack.zip -o$HOME/work_dir/game -y
          rm -f ~/work_dir/pack.zip
          find ~/work_dir/game -type f -exec mv -i {} ~/work_dir/game/ \; 2>/dev/null || true
          ls -la ~/work_dir/game

      - name: Restaurer le cache Rewrite (Arceus)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/work_dir/game/01001F5010DFA000_build/rewrite
            ~/work_dir/game/01001F5010DFA000_build/shader
          key: rewrite-arceus-${{ github.run_id }}
          restore-keys: |
            rewrite-arceus-

      - name: Generer le fichier IPA
        run: |
          rm -rf ~/work_dir/game/01001F5010DFA000_build/shader
          KEYS_FILE=$(find ~/work_dir/game -iname "*prod.keys*" | head -n 1)
          python3 scripts/build_ipa_from_nsp.py ~/work_dir/game -k "$KEYS_FILE" -o ~/work_dir/Arceus.ipa --lang fr --allow-other-metal || {
            echo "=== ERREURS EXACTES XCODEBUILD ==="
            grep -E "error:|fatal error:|FAIL" ~/work_dir/game/01001F5010DFA000_build/ipa/build/ios/pkg/build.log || true
            exit 1
          }

      - name: Sauvegarder le cache Rewrite (Arceus)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/work_dir/game/01001F5010DFA000_build/rewrite
            ~/work_dir/game/01001F5010DFA000_build/shader
          key: rewrite-arceus-${{ github.run_id }}

      - name: Uploader le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Arceus-IPA
          path: ~/work_dir/Arceus.ipa
          retention-days: 1
