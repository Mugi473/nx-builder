name: Build NXNative IPA (Standard)

on:
  workflow_dispatch:
    inputs:
      gdrive_zip_id:
        description: 'ID Google Drive (ou URL) de ton ZIP (Jeu + MAJ + prod.keys)'
        required: true
        type: string
      romfs_mode:
        description: 'Mode RomFS (embedded = IPA complet, separate = IPA léger + dossier romfs)'
        required: true
        default: 'embedded'
        type: choice
        options:
          - embedded
          - separate

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Libérer de l'espace disque sur le runner macOS 15
        run: |
          df -h
          sudo rm -rf /Applications/Xcode_16.0.app /Applications/Xcode_16.1.app || true
          sudo rm -rf /Library/Developer/CoreSimulator /usr/local/share/boost /opt/homebrew/Cellar/llvm || true
          df -h

      - name: Télécharger et extraire le pack ZIP (Jeu + MAJ + Keys) depuis Google Drive
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          RAW_INPUT: ${{ inputs.gdrive_zip_id }}
        run: |
          mkdir -p workspace/pack
          cd workspace
          
          if [[ "$RAW_INPUT" == *"drive.google.com"* ]]; then
            FILE_ID=$(echo "$RAW_INPUT" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
            if [ -z "$FILE_ID" ]; then
              FILE_ID=$(echo "$RAW_INPUT" | sed -n 's/.*id=\([a-zA-Z0-9_-]*\).*/\1/p')
            fi
          else
            FILE_ID="$RAW_INPUT"
          fi
          
          echo "Téléchargement de l'archive Google Drive ID: $FILE_ID..."
          curl -L -sS --fail \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&acknowledgeAbuse=true&key=${GDRIVE_API_KEY}" \
            -o game_bundle.zip
            
          ls -lh game_bundle.zip
          unzip -q game_bundle.zip -d pack/
          rm -f game_bundle.zip
          ls -laR pack/

      - name: Détecter et renommer proprement Base, Update et prod.keys
        id: detect
        run: |
          cd workspace/pack
          
          # 1. Trouver prod.keys et le copier sous un nom simple sans espaces ni guillemets
          KEYS_FILE=$(find . -type f \( -iname "prod.keys" -o -iname "*.keys" \) | head -n 1)
          if [ -z "$KEYS_FILE" ]; then
            echo "Erreur : Aucun fichier prod.keys trouvé dans le ZIP !"
            exit 1
          fi
          cp "$KEYS_FILE" ../prod.keys
          echo "Clés préparées : $(realpath ../prod.keys)"
          
          # 2. Trouver le plus gros NSP/XCI (Jeu de base) et le second (MAJ) via Python (insensible aux apostrophes/espaces)
          python3 - << 'EOF'
          import os, glob, shutil

          exts = ('.nsp', '.xci')
          files = []
          for root, _, filenames in os.walk('.'):
              for f in filenames:
                  if f.lower().endswith(exts) and not f.startswith('._'):
                      p = os.path.join(root, f)
                      files.append((os.path.getsize(p), p))

          files.sort(reverse=True)
          if not files:
              raise SystemExit("Erreur : Aucun fichier .nsp ou .xci trouvé !")

          base_ext = os.path.splitext(files[0][1])[1].lower()
          base_dest = os.path.abspath(f"../base{base_ext}")
          print(f"Jeu de base détecté ({files[0][0] // (1024*1024)} MB) : {files[0][1]} -> {base_dest}")
          shutil.move(files[0][1], base_dest)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"keys={os.path.abspath('../prod.keys')}\n")
              out.write(f"base={base_dest}\n")
              if len(files) >= 2:
                  upd_ext = os.path.splitext(files[1][1])[1].lower()
                  upd_dest = os.path.abspath(f"../update{upd_ext}")
                  print(f"Mise à jour détectée ({files[1][0] // (1024*1024)} MB) : {files[1][1]} -> {upd_dest}")
                  shutil.move(files[1][1], upd_dest)
                  out.write(f"update={upd_dest}\n")
          EOF

      - name: Compiler avec NXNative
        run: |
          mkdir -p output
          
          if [ ! -f "./nxnative" ]; then
            echo "Récupération du binaire nxnative..."
            curl -L -sS --fail "https://github.com/nxnative/nxnative/releases/latest/download/nxnative-macos-arm64" -o ./nxnative || true
          fi
          chmod +x ./nxnative || true
          
          if [ -n "${{ steps.detect.outputs.update }}" ]; then
            ./nxnative build \
              --base "${{ steps.detect.outputs.base }}" \
              --update "${{ steps.detect.outputs.update }}" \
              --keys "${{ steps.detect.outputs.keys }}" \
              --romfs ${{ inputs.romfs_mode }} \
              --output ./output
          else
            ./nxnative build \
              --base "${{ steps.detect.outputs.base }}" \
              --keys "${{ steps.detect.outputs.keys }}" \
              --romfs ${{ inputs.romfs_mode }} \
              --output ./output
          fi
          
          rm -rf workspace

      - name: Uploader l'IPA (et le RomFS si séparé)
        uses: actions/upload-artifact@v4
        with:
          name: NXNative-Build-${{ inputs.romfs_mode }}
          path: |
            output/*.ipa
            output/romfs/**
          retention-days: 5
